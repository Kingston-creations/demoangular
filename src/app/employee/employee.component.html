<!-- src/app/components/employee-form/employee-form.component.html -->

<form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" />
    </div>
  
    <div class="form-group">
      <label for="companyName">Company Name</label>
      <input id="companyName" type="text" formControlName="companyName" />
    </div>
  
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
    </div>
  
    <div class="form-group">
      <label for="contactNo">Contact No.</label>
      <input id="contactNo" type="text" formControlName="contactNo" />
    </div>
  
    <div class="form-group">
      <label for="designation">Designation</label>
      <input id="designation" type="text" formControlName="designation" />
    </div>
  
    <button type="submit" [disabled]="employeeForm.invalid">
      {{ employee ? 'Update' : 'Add' }} Employee
    </button>
  </form>
